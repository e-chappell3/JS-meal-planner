<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- set up page name and icon -->
    <title>Ingredient List</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
    <!-- import font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <style>
        :root{
            /* Color Variables */
            --pink: #DDBCD9;
            --shadowPink: #BFAABB;
            --yellow: #FAD793;
            --shadowYellow: #CDA770;
        }

        html, body{
            /* control page sizing */
            margin: 0;
            width: auto;
            height: auto;
            overflow: hidden;
        }

        body{
            /* set up background image with no overflow */
            background-image: url(assets/backkitchen.png);
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        *{
            /* appply font to entire page */
            font-family:  "Pixelify Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        
        .container {
            /* center container */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .region {
            /* define + position region to match with .note using scrollbar for any overflow outside region size */
            position: absolute;
            left: 47%;
            top: 61%;
            height: 20vw;
            width: 20vw;
            transform: translate(-10vw, -10vw);
            overflow: scroll;
            z-index: 1;
        }

        .note {
            /* center + position note */
            display: block;
            margin-right: auto;
            margin-left: auto;
            margin-top: -4vw;
            width: 40%;
            z-index: 99;
        }

        button {
            /* style all buttons */
            color: #fff;
            background-color: var(--shadowYellow);
            margin: 6px;
            border: 0;
            box-shadow: 0px 5px var(--shadowPink), 0px -5px var(--shadowPink), 5px 0px var(--shadowPink), -5px 0px var(--shadowPink), 0px 10px #00000038, 5px 5px #00000038, -5px 5px #00000038, inset 0px 5px #ffffff36 ;
            cursor: pointer;
        }

        button:active {
            /* style button when active */
            box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black,inset 0px 5px #00000038;
        }

        .back{
            /* style back button */
            border: none;
            background: none;
            box-shadow: none;
        }
    </style>
</head>
<body>    
    <div class="region">
        <!-- container for all items that need to fit on fridge note img -->
        <div class="container">
            <!-- container for inputting ingredients -->
            <input type="text" id="ingredientName" placeholder="Add an Ingredient">
            <button id="add">Add</button>
        </div>
        <!-- list of stored ingredients -->
        <ul id="ingredientList"></ul>
    </div>
    <!-- back button with image -->
    <button class="back" onclick="window.history.back()">
        <img src="assets/backarrow.png"/>
    </button>
    <!-- fridge note image -->
    <img src="assets/fridgenote.png" class="note">
    <script src="script.js"></script>
</body>
</html>
