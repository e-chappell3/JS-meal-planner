<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredient List</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <style>
        :root{
            --pink: #DDBCD9;
            --shadowPink: #BFAABB;
            --yellow: #FAD793;
            --shadowYellow: #CDA770;
        }

        html, body{
            margin: 0;
            width: auto;
            height: auto;
            overflow: hidden;
        }

        body{
            background-image: url(assets/backkitchen.png);
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        *{
            font-family:  "Pixelify Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .region {
            position: absolute;
            left: 47%;
            top: 61%;
            height: 20vw;
            width: 20vw;
            transform: translate(-10vw, -10vw);
            overflow: scroll;
            z-index: 1;
        }

        .note {
            display: block;
            margin-right: auto;
            margin-left: auto;
            margin-top: -4vw;
            width: 40%;
            z-index: 99;
        }
        
        ul{
            padding: 0;
        }

        .back{
            border: none;
            background: none;
        }
    </style>
</head>
<body>    
    <div class="region">
        <div class="container">
            <input type="text" id="ingredientName" placeholder="Add an Ingredient">
            <button id="add">Add</button>
        </div>
        <ul id="ingredientList"></ul>
    </div>
    <button class="back" onclick="window.history.back()">
        <img src="assets/backarrow.png"/>
    </button>
    <img src="assets/fridgenote.png" class="note">
    <script src="script.js"></script>
</body>
</html>
