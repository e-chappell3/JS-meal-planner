<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- set up page name and icon -->
    <title>What's in your Fridge?</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
    <!-- import font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <style>
        :root{
            /* Color Variables */
            --brown: #D7CEC5;
            --blue: #C7CCF5;
            --cream: #F6F6EC;
            --grey: #2E2D29;
        }

        html, body{
            /* control page sizing w/ hidden overflow */
            margin: 0;
            width: auto;
            height: auto;
            overflow: hidden;
        }

        body{
            /* set up background image with no overflow */
            background-image: url(assets/backkitchen.png);
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        *{
            /* apply font to entire page */
            font-family:  "Pixelify Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        .container{
            /* center container */
            display: flex;
            justify-content: center;
            margin-top: -2vw
        }

        h1{
            /* style main heading + prevent text wrapping */
            white-space: nowrap;
            font-size: 4vw;
            text-shadow: 2px 2px var(--cream);
        }

        .region{
            /* define + position region to fit within fridge container/img */
            position: absolute;
            left: 40%;
            top: 50%;
            height: 32vw;
            width: 24vw;
            transform: translate(-12vw, -16vw);
            overflow: scroll;
            z-index: 1;
        }

        .fridge {
            /* position + size fridge image (ensure behind region container) */
            display: block;
            margin-right: auto;
            margin-left: auto;
            margin-top: -4vw;
            width: 50%;
            z-index: 99;
        }

        .back{
            /* style back button */
            border: none;
            background: none;
            box-shadow: none;
        }

        ul{
            /* style list of ingredients */
            font-size: 1.5vw;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- container for page contents -->
        <button class="back" onclick="window.history.back()">
            <img src="assets/backarrow.png"/>
        </button>
        <h1> What Ingredients do you Have?</h1>
        <div class = "region">
            <!-- nested container for ingredient list -->
             <!-- list of ingredients including if they are currently owned/not -->
            <ul id="ownedList"></ul>
        </div>
    </div>
    <!-- fridge image -->
    <img src="assets/openfridge.png" class="fridge">
    <script src="script.js"></script>
</body>
</html>
