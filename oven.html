<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What can you make?</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
        :root{
            --darkBlue: #0a1c2a;
            --midBlue: #456b96;
            --lightBlue: #9cc1ea;
        }

        html, body{
            margin: 0;
            width: auto;
            height: auto;
            overflow: hidden;
        }

        body{
            background-image: url(assets/backkitchen.png);
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        *{
            font-family:  "Pixelify Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        h1{
            font-size: 4vw;
        }

        h2{
            font-size: 2.5vw;
        }

        ul{
            font-size: 1.5vw;
        }

        .header{
            display: flex;
            justify-content: center;
        }
        
        .buttonContainer{
            display: flex;
            justify-content: center;
            margin-top: -2vw;
        }

        .mainContainer{
            display: flex;
            flex-direction: row;
        }

        .back{
            border: none;
            background: none;
        }

        .oven {
            display: block;
            margin-right: auto;
            margin-left: 10vw;
            width: 50%;
        }

        .ownedList{
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back" onclick="window.history.back()">
            <img src="assets/backarrow.png"/>
        </button>
        <h1> What can I Cook?</h1>
    </div>
    <div class="buttonContainer">
        <button id="recipeAdd">Add New Recipe</button>
        <button id="make" onclick="">What can I make?</button>
    </div>
    <div class="mainContainer">
         <div class="recipeContainer">
            <h2> Recipes:</h2>
            <ul id="recipeList"></ul>
        </div>       

        <img src="assets/openoven.png" class="oven">

        <div class="makeContainer">
            <h2> What To Make:</h2>
            <ul id="makeList"></ul>
        </div> 
    </div>
    <ul id="ownedList" class="ownedList"></ul>

   
    <script src="script.js"></script>
</body>
</html>
