<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Recipe</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
        :root{
            --red: #C0555D;
            --shadowRed: #A33649;
            --lightBlue: #71B1BD;
            --shadowBlue: #4D98AD;
            --brown: #51392D;
            --cream: #DED6C3;
            --shadowCream: #CFC1A4;
        }

        html, body{
            margin: 0;
            width: auto;
            height: auto;
            overflow: hidden;
        }

        body{
            background-image: url(assets/backkitchen.png);
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        *{
            font-family:  "Pixelify Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        .ingredientList{
            visibility: hidden;
        }

        .back{
            border: none;
            background: none;
        }

        .header{
            display: flex;
            justify-content: center;
        }

        .region {
            position: absolute;
            left: 50%;
            top: 59%;
            height: 34vw;
            width: 44vw;
            transform: translate(-22vw, -17vw);
            overflow: scroll;
            z-index: 1;

            display: flex;

        }

        .pageTwo {
            margin-top: 4vw;
        }

        .book {
            display: block;
            margin-right: auto;
            margin-left: auto;
            margin-top: -28vw;
            width: 50%;
            z-index: 99;
        }

        ul{
            font-size: 1.25vw;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 Make a Recipe!></h1>
        <button id="recipeBack" class="back" onclick="window.history.back()">
            <img src="assets/backarrow.png"/>
        </button>
    </div>
    <div class="region">
        <div class="pageOne">
            <input type="text" id="recipeName" placeholder="Name your Recipe">
            <input type="text" id="ingredSearch" placeholder="Find Ingredient">
            <ul id="resultsList"></ul>
            <ul id="neededList"></ul>
            <button id="done">Save Recipe</button>
        </div>
        <div class="pageTwo">
            <ul id="recipeList"></ul>
        </div>
    </div>
    
    <ul id="ingredientList" class="ingredientList"></ul>
    
    <img src="assets/recipebook.png" class="book">
    <script src="script.js"></script>
</body>
</html>
