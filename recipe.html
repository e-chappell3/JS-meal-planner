<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Recipe</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
        :root{
            --red: #C0555D;
            --shadowRed: #A33649;
            --lightBlue: #71B1BD;
            --shadowBlue: #4D98AD;
            --brown: #51392D;
            --cream: #DED6C3;
            --shadowCream: #CFC1A4;
        }

        html, body{
            margin: 0;
            width: auto;
            height: auto;
            overflow: hidden;
        }

        body{
            background-image: url(assets/backkitchen.png);
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        *{
            font-family:  "Pixelify Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        .back{
            border: none;
            background: none;
        }
    </style>
</head>
<body>
    <input type="text" id="recipeName" placeholder="Name your Recipe">
    <input type="text" id="ingredSearch" placeholder="Find Ingredient">
    <ul id="ingredientList"></ul>
    <ul id="resultsList"></ul>
    <ul id="neededList"></ul>
    <ul id="recipeList"></ul>
    <button id="done">Save Recipe</button>
    <button class="back" onclick="window.history.back()">
        <img src="assets/backarrow.png"/>
    </button>
    <script src="script.js"></script>
</body>
</html>
