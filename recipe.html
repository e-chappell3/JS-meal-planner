<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Recipe</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
        :root{
            --red: #C0555D;
            --shadowRed: #A33649;
            --lightBlue: #71B1BD;
            --shadowBlue: #4D98AD;
            --brown: #51392D;
            --cream: #DED6C3;
            --shadowCream: #CFC1A4;
        }

        html, body{
            margin: 0;
            width: auto;
            height: auto;
            overflow: hidden;
        }

        body{
            background-image: url(assets/backkitchen.png);
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        *{
            font-family:  "Pixelify Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        .ingredientList{
            visibility: hidden;
        }

        .header{
            display: flex;
            justify-content: center;
            margin-top: -2vw;
        }

        h1{
            font-size: 4vw;
            text-shadow: 2px 2px var(--cream);
        }

        .region {
            position: absolute;
            left: 50%;
            top: 59%;
            height: 34vw;
            width: 44vw;
            transform: translate(-22vw, -17vw);
            overflow: scroll;
            z-index: 1;

            display: flex;

        }

        .pageOne {
            margin-left: 1.2vw;
            margin-top: 1.6vw;
        }

        .pageTwo {
            margin-left: 11vw;
            margin-top: 4vw;
        }
        

        .book {
            display: block;
            margin-right: auto;
            margin-left: auto;
            margin-top: -35vw;
            width: 50%;
            z-index: 99;
        }

        .inputs{
            display: flex;
            flex-direction: column;
        }

        ul{
            font-size: 1.25vw;
        }

        button {
            color: #fff;
            background-color: var(--shadowBlue);
            margin: 6px;
            border: 0;
            box-shadow: 0px 5px var(--brown), 0px -5px var(--brown), 5px 0px var(--brown), -5px 0px var(--brown), 0px 10px #00000038, 5px 5px #00000038, -5px 5px #00000038, inset 0px 5px #ffffff36 ;
            cursor: pointer;
        }

        button:active {
            box-shadow: 0px 5px black, 0px -5px black, 5px 0px black, -5px 0px black,inset 0px 5px #00000038;
        }

        .back{
            border: none;
            background: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="recipeBack" class="back" onclick="window.history.back()">
            <img src="assets/backarrow.png"/>
        </button>
        <h1> Make a Recipe!</h1>
    </div>
    <div class="region">
        <div class="pageOne">
            <div class="inputs">
                <input type="text" id="recipeName" placeholder="Name your Recipe">
                <input type="text" id="ingredSearch" placeholder="Find Ingredient">
            </div>
            <ul id="resultsList"></ul>
            <ul id="neededList"></ul>
            <button id="done">Save Recipe</button>
        </div>
        <div class="pageTwo">
            <ul id="recipeList"></ul>
        </div>
    </div>
    
    <ul id="ingredientList" class="ingredientList"></ul>
    
    <img src="assets/recipebook.png" class="book">
    <script src="script.js"></script>
</body>
</html>
