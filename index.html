<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- import font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- set page name and icon -->
    <title>Joe's Kitchen!</title>
    <link rel="icon" type="image/png" href="https://i.redd.it/gz8bz6ffh8191.png?">
</head>
<body>
    <div class = "container">
        <div class="header">
            <!-- Title and help button in header container -->
            <h1>Joe's Kitchen</h1>
            <div class="helpButton">
                <button class="help">
                    <!-- Image for help button and text that appears on hover -->
                    <img src="assets/question.png"/>
                    <span class="helpText">
                        Click the note on the fridge to add ingredients, click the top fridge compartment to select ingredients you have & click the oven to explore recipes.
                    </span>
                </button>
            </div>
        </div>


        <!-- buttons to redirect you to the other html pages -->
        <button class="fridge" id="fridgeButton"></button>
        <button class="note" id="noteButton"></button>
        <button class="oven" id="ovenButton"></button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
